# Audio path
CONFIG_I2S=y
CONFIG_I2S_SAM_SSC=y
# DMA TX queue depth; the sample's mem_slab is the byte pool the driver draws
# blocks from on top of it.
CONFIG_I2S_SAM_SSC_TX_BLOCK_COUNT=16
CONFIG_DMA=y
CONFIG_DMA_SAM_XDMAC=y
CONFIG_I2C=y
CONFIG_I2C_SAM_TWIHS=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_AUDIO_CODEC_WM8904=y

# The codec drives both clocks, so the SSC receive clock pins are unused and
# the receiver is clocked from TK.
CONFIG_I2S_SAM_SSC_0_PIN_RF_EN=n
CONFIG_I2S_SAM_SSC_0_PIN_RK_EN=n

# PLLACK at 12 MHz * 32 = 384 MHz, so PCK2 divides down to the codec MCLK of
# 3.072 MHz exactly. HCLK and MCK follow from it and the board overlay repeats
# HCLK for the drivers that read it from the device tree.
CONFIG_SOC_ATMEL_SAM_PLLA_MULA=31
CONFIG_SOC_ATMEL_SAM_PLLA_DIVA=1
CONFIG_SOC_ATMEL_SAM_MCK_PRESCALLER=2
CONFIG_SOC_ATMEL_SAM_MDIV=2

# Network path
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_IPV4_IGMP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_RTP=y
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_ZVFS_POLL_MAX=5

CONFIG_MAIN_STACK_SIZE=2048

# The jitter buffer is larger than a 16-bit ring buffer index can address.
CONFIG_RING_BUFFER_LARGE=y
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_RTP_LOG_LEVEL_INF=y

# The SSC driver reports the cause of a transmitter stop at debug level only:
# a hardware underrun and an empty block queue produce the same error to the
# application.
CONFIG_I2S_LOG_LEVEL_DBG=y
