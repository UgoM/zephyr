#USB related configs
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_AUDIO2_CLASS=y
CONFIG_SAMPLE_USBD_PID=0x0010
CONFIG_SAMPLE_USBD_PRODUCT="UAC2 DAC sample"

#Audio output: the codec driver paces the stream from a timer-triggered DMA,
#so no system tick is involved in producing samples.
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_DAC=y
CONFIG_DMA=y
CONFIG_COUNTER=y

#Pipeline: app_src -> queue -> dac_sink
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_MPIPE=y
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_APP_SRC=y
CONFIG_MPIPE_BASE_QUEUE=y
CONFIG_MPIPE_AUDIO=y
CONFIG_MPIPE_AUDIO_DAC_SINK=y
#One USB isochronous packet is 48 mono 16-bit samples, 96 bytes
CONFIG_MPIPE_BASE_APP_SRC_BUF_SZ=96
CONFIG_MPIPE_BASE_APP_SRC_POOL_NUM=32
CONFIG_MPIPE_BASE_APP_SRC_QUEUE_DEPTH=16
CONFIG_MPIPE_BASE_QUEUE_MAX_SIZE=16
CONFIG_MPIPE_AUDIO_DAC_SINK_BLOCK_SIZE=96
#One thread for the pipeline, one for the queue, which runs its own
CONFIG_MPIPE_THREADS_NUM=2

#Caps negotiation recurses down the pipeline with three struct mpipe_structure
#(88 bytes each) per element, which overflows the 1 KiB default main stack.
CONFIG_MAIN_STACK_SIZE=4096

#LOG subsystem related configs
CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
