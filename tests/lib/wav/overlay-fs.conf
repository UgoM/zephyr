# Adds the CONFIG_WAV_FS byte source, and the littlefs instance the equivalence
# test writes its containers to.

CONFIG_WAV_FS=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# littlefs is stack hungry, and the equivalence test keeps two parsers alive.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
