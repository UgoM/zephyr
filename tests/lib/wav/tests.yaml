common:
  tags: wav
  integration_platforms:
    - native_sim

tests:
  libraries.wav.mem: {}
  libraries.wav.max_chunks:
    extra_configs:
      - CONFIG_WAV_MAX_CHUNKS=4
  libraries.wav.log:
    extra_configs:
      - CONFIG_LOG=y
      - CONFIG_WAV_LOG_LEVEL_DBG=y
  libraries.wav.fs:
    extra_conf_files:
      - overlay-fs.conf
    modules:
      - littlefs
    platform_allow:
      - native_sim
      - native_sim/native/64
      - nrf52840dk/nrf52840
      - mps2/an385
